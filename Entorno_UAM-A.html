<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mapa Mapbox - Prueba</title>

  <!-- Mapbox GL JS CSS -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />

  <style>
    /* Reset muy básico */
    html, body { height: 100%; margin: 0; font-family: Arial, sans-serif; }
    /* Contenedor del mapa ocupa toda la ventana */
    #map { width: 100%; height: 100vh; }
    /* Pequeño panel de control encima del mapa */
    .panel {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 2;
      background: rgba(255,255,255,0.9);
      padding: 8px 10px;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      font-size: 14px;
    }
    .panel input { width: 180px; padding: 4px; }
    .panel button { margin-left:6px; padding:4px 8px; }
  </style>
</head>
<body>

  <div class="panel">
    <strong>Mapbox - Prueba</strong><br/>
    Centro: <input id="coords" value="-99.1332,19.4326" title="long,lat" />
    <button id="go">Ir</button>
  </div>

  <div id="map" aria-label="Mapa interactivo Mapbox"></div>

  <!-- Mapbox GL JS -->
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>

  <script>
    // --- 1) Pega aquí tu token de Mapbox ---
    // Consigue uno gratis en https://account.mapbox.com/access-tokens/ (crea cuenta -> Access tokens -> Create token)
    // Reemplaza 'YOUR_MAPBOX_ACCESS_TOKEN_HERE' por tu token real.
    mapboxgl.accessToken = 'YOUR_MAPBOX_ACCESS_TOKEN_HERE';

    // --- 2) Configuración inicial del mapa ---
    // coordenadas por defecto: Ciudad de México (longitud, latitud)
    const defaultCenter = [-99.1332, 19.4326];
    const defaultZoom = 11;

    // Comprueba que haya token; si no, muestra mensaje sencillo en la consola y en el DOM.
    if (!mapboxgl.accessToken || mapboxgl.accessToken === 'YOUR_MAPBOX_ACCESS_TOKEN_HERE') {
      document.getElementById('map').innerHTML = '<div style="padding:20px;">Pega tu <strong>Mapbox Access Token</strong> en el archivo HTML (variable <code>mapboxgl.accessToken</code>) para que el mapa funcione.</div>';
      console.warn('Mapbox: por favor pega tu token en mapboxgl.accessToken');
      // se detiene la inicialización para evitar errores
    } else {
      // crear el mapa
      const map = new mapboxgl.Map({
        container: 'map',
        style: 'mapbox://styles/mapbox/streets-v12', // estilo base
        center: defaultCenter,
        zoom: defaultZoom,
        // key opcional: preferencia de interacciones
        projection: 'mercator'
      });

      // añadir control de navegación (zoom + rotación)
      map.addControl(new mapboxgl.NavigationControl(), 'top-right');

      // añadir control de geolocate (si el navegador lo permite)
      map.addControl(new mapboxgl.GeolocateControl({
        positionOptions: { enableHighAccuracy: true },
        trackUserLocation: false,
        showUserHeading: true
      }), 'top-right');

      // al cargar, añadimos un marcador con popup
      map.on('load', () => {
        const marker = new mapboxgl.Marker({ draggable: false })
          .setLngLat(defaultCenter)
          .setPopup(new mapboxgl.Popup({ offset: 25 }).setHTML('<strong>Prueba Mapbox</strong><br/>Centro: Ciudad de México'))
          .addTo(map);

        // ejemplo: añadir una capa simple con un círculo (GeoJSON)
        map.addSource('punto-ejemplo', {
          type: 'geojson',
          data: {
            type: 'FeatureCollection',
            features: [
              {
                type: 'Feature',
                geometry: { type: 'Point', coordinates: defaultCenter },
                properties: { title: 'Ejemplo', description: 'Punto de prueba' }
              }
            ]
          }
        });

        map.addLayer({
          id: 'circulo-ejemplo',
          type: 'circle',
          source: 'punto-ejemplo',
          paint: {
            'circle-radius': 8,
            'circle-stroke-width': 2,
            'circle-stroke-color': '#ffffff'
          }
        });
      });

      // Botón "Ir" para centrar en coordenadas escritas (formato: lon,lat)
      document.getElementById('go').addEventListener('click', () => {
        const v = document.getElementById('coords').value.split(',').map(s => parseFloat(s.trim()));
        if (v.length === 2 && !isNaN(v[0]) && !isNaN(v[1])) {
          map.flyTo({ center: [v[0], v[1]], zoom: 13 });
        } else {
          alert('Introduce coordenadas válidas en formato "longitud,latitud" (ej: -99.1332,19.4326).');
        }
      });
    }
  </script>
</body>
</html>
